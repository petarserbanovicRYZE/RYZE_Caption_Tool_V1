name: ryze-caption-tool-mac

services:
  preflight:
    container_name: ryze-caption-tool-mac-builder
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace
    network_mode: none
    security_opt:
      - no-new-privileges:true
    command: ["/bin/bash", "/workspace/mac-builder/docker-preflight.sh"]
